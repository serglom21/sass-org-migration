[project]
name = "org-copy"
version = "0.1.0"
description = "Copy Sentry organization settings between regions through the public API."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
org-copy = "org_copy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["org_copy*"]
